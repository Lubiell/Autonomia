name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: bash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sintaxe
        run: for f in .claude/hooks/*.sh .github/scripts/*.sh install.sh package.sh tests/*.sh; do bash -n "$f"; done
      # shellcheck já vem nos runners Ubuntu do GitHub.
      - name: Lint (shellcheck)
        if: runner.os == 'Linux'
        run: shellcheck -S warning .claude/hooks/*.sh .github/scripts/*.sh install.sh package.sh tests/*.sh
      # No macOS, /bin/bash é o 3.2 que o hook precisa suportar.
      - name: Hook
        run: |
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash tests/guard.test.sh; else bash tests/guard.test.sh; fi
      - name: Hook de verificação (verify-stop.sh)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash tests/verify-stop.test.sh; else bash tests/verify-stop.test.sh; fi
      - name: Skills e agents (frontmatter)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash tests/skills.test.sh; else bash tests/skills.test.sh; fi
      - name: Empacotador (package.sh)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash tests/package.test.sh; else bash tests/package.test.sh; fi
      - name: Instalador (install.sh)
        if: runner.os != 'Windows'
        run: bash tests/install.test.sh

  powershell:
    name: install.ps1 (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalador (install.ps1)
        shell: pwsh
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File tests/install.test.ps1
          exit $LASTEXITCODE
      - name: Empacotador (package.ps1)
        shell: pwsh
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File tests/package.test.ps1
          exit $LASTEXITCODE

  bat:
    name: instalar-autonomia.bat
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalador de um clique (baixa o zip deste commit e instala)
        shell: cmd
        env:
          AUTONOMIA_ZIP: https://github.com/${{ github.repository }}/archive/${{ github.event.pull_request.head.sha || github.sha }}.zip
          AUTONOMIA_SEM_PAUSA: "1"
          CLAUDE_HOME: ${{ runner.temp }}\claude-bat
        run: call instalar-autonomia.bat
      - name: Conferir a instalação
        shell: pwsh
        env:
          CLAUDE_HOME: ${{ runner.temp }}\claude-bat
        run: |
          $agents = (Get-ChildItem "$env:CLAUDE_HOME\agents\*.md").Count
          $skills = (Get-ChildItem "$env:CLAUDE_HOME\skills" -Directory).Count
          Write-Host "agents: $agents  skills: $skills"
          if (-not (Test-Path "$env:CLAUDE_HOME\CLAUDE.md")) { throw 'CLAUDE.md ausente' }
          if (-not (Test-Path "$env:CLAUDE_HOME\settings.json")) { throw 'settings.json ausente' }
          if ($agents -lt 15 -or $skills -lt 100) { throw 'instalação incompleta' }
